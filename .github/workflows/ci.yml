name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false
          version: latest-known
      - name: Install Python
        run: uv python install 3.12
      - name: Install project
        run: uv sync --extra dev
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run pyright
      - name: Test
        run: uv run pytest --cov=ally --cov-report=term-missing
      - name: Core behavioral evaluations
        run: uv run ally eval run evals/cases/core.jsonl

  macos-smoke:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false
          version: latest-known
      - name: Install Python
        run: uv python install 3.12
      - name: Install project
        run: uv sync --extra dev
      - name: Test macOS portability
        run: uv run pytest
      - name: Core behavioral evaluations
        run: uv run ally eval run evals/cases/core.jsonl
