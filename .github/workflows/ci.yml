name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.15"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          version: ${{ env.UV_VERSION }}
      - name: Install Python
        run: uv python install 3.12
      - name: Install locked project
        run: uv sync --locked --extra dev
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run pyright
      - name: Test
        run: uv run pytest --cov=ally --cov-report=term-missing --cov-fail-under=80
      - name: Core behavioral evaluations
        run: uv run ally eval run evals/cases/core.jsonl

  macos-smoke:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          version: ${{ env.UV_VERSION }}
      - name: Install Python
        run: uv python install 3.12
      - name: Install locked project
        run: uv sync --locked --extra dev
      - name: Test macOS portability
        run: uv run pytest
      - name: Core behavioral evaluations
        run: uv run ally eval run evals/cases/core.jsonl
