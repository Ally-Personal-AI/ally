name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.15"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          version: ${{ env.UV_VERSION }}
      - name: Install Python
        run: uv python install 3.12
      - name: Install locked project
        run: uv sync --locked --extra dev
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run pyright
      - name: Test
        run: uv run pytest --cov=ally --cov-report=term-missing --cov-fail-under=80
      - name: Core behavioral evaluations
        run: uv run ally eval run

  macos-smoke:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          version: ${{ env.UV_VERSION }}
      - name: Install Python
        run: uv python install 3.12
      - name: Install locked project
        run: uv sync --locked --extra dev
      - name: Test macOS portability
        run: uv run pytest
      - name: Core behavioral evaluations
        run: uv run ally eval run
      - name: Build ad-hoc release through production orchestrator
        run: |
          set -euo pipefail
          uv run --locked python scripts/macos_release_pipeline.py build \
            --mode adhoc \
            --source-revision "$GITHUB_SHA" \
            --build-version "1" \
            --output-dir "$RUNNER_TEMP/ally-release" \
            --clean
          python scripts/macos_app_bundle.py verify \
            "$RUNNER_TEMP/ally-release/Ally.app"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          metadata = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "ally-release" / "release-artifact.json")
              .read_text(encoding="utf-8")
          )
          assert metadata["release_helper_toolchain"] == {
              "pyinstaller": "6.22.3",
              "pyinstaller-hooks-contrib": "2026.7",
          }
          environment = metadata["build_environment"]
          assert environment["python_implementation"] == "CPython"
          assert environment["uv_version"] == "0.12.15"
          for key in (
              "python_version",
              "swift_version",
              "macos_version",
              "architecture",
          ):
              assert isinstance(environment[key], str) and environment[key]
          PY
      - name: Test native macOS desktop package
        env:
          ALLY_PACKAGED_HELPER_TEST_PATH: ${{ runner.temp }}/ally-release/Ally.app/Contents/Helpers/ally-desktop-bridge
          ALLY_PACKAGED_HELPER_TEST_ROOT: ${{ runner.temp }}/ally-swift-home
        run: |
          set -euo pipefail
          mkdir -p "$ALLY_PACKAGED_HELPER_TEST_ROOT" "$RUNNER_TEMP/ally-swift-tmp"
          HOME="$ALLY_PACKAGED_HELPER_TEST_ROOT" \
          TMPDIR="$RUNNER_TEMP/ally-swift-tmp" \
            swift test --package-path desktop/macos
      - name: Exercise update-candidate trust boundary
        run: |
          set -euo pipefail
          python scripts/macos_app_bundle.py assemble \
            --app-executable "$RUNNER_TEMP/ally-release/Ally.app/Contents/MacOS/AllyDesktop" \
            --helper "$RUNNER_TEMP/ally-release/Ally.app/Contents/Helpers/ally-desktop-bridge" \
            --output "$RUNNER_TEMP/Ally-Candidate.app" \
            --source-revision "$GITHUB_SHA" \
            --build-version "2"
          python scripts/macos_release_signing.py sign \
            "$RUNNER_TEMP/Ally-Candidate.app" \
            --identity - \
            --no-timestamp
          uv run python scripts/macos_update_trust.py compare \
            --current "$RUNNER_TEMP/ally-release/Ally.app" \
            --candidate "$RUNNER_TEMP/Ally-Candidate.app"
          if uv run python scripts/macos_update_trust.py verify-update \
            --current "$RUNNER_TEMP/ally-release/Ally.app" \
            --candidate "$RUNNER_TEMP/Ally-Candidate.app" \
            --team-id ABCDE12345; then
            echo "ad-hoc signed bundle unexpectedly passed production update trust"
            exit 1
          fi

  distribution:
    name: Distribution (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          version: ${{ env.UV_VERSION }}
      - name: Install Python
        run: uv python install 3.12
      - name: Install locked build backend
        run: uv sync --locked --group build
      - name: Verify distribution and installed workflows
        run: uv run --locked --group build python scripts/check_distribution.py
