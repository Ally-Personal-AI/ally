name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.15"

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          version: ${{ env.UV_VERSION }}
      - name: Install Python
        run: uv python install 3.12
      - name: Install locked security tools
        run: uv sync --locked --extra security
      - name: Export locked runtime and release-helper dependencies
        run: >-
          uv export --locked --no-dev --no-emit-project
          --group release-helper
          --output-file /tmp/ally-audited-requirements.txt
      - name: Audit locked runtime and release-helper dependencies
        run: >-
          uv run pip-audit --strict --require-hashes --disable-pip
          --progress-spinner off
          --requirement /tmp/ally-audited-requirements.txt
      - name: Audit GitHub workflow definitions offline
        run: >-
          uv run zizmor --offline --strict-collection --format=github
          .github
