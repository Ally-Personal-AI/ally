name: Temporary release-helper lock resolver

on:
  push:
    branches:
      - hardening/lock-release-helper-toolchain

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_VERSION: "0.12.15"
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install Python
        run: uv python install 3.12
      - name: Resolve lockfile
        run: uv lock
      - name: Emit lockfile for branch update
        shell: bash
        run: |
          set -euo pipefail
          echo "ALLY_LOCK_BASE64_BEGIN"
          base64 -w 0 uv.lock
          echo
          echo "ALLY_LOCK_BASE64_END"
