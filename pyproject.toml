[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ally-personal-ai"
version = "0.1.0.dev0"
description = "A local-first, user-owned personal AI platform."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Ally Personal AI contributors" }]
dependencies = [
  "httpx>=0.28,<1",
  "platformdirs>=4.3,<5",
  "pydantic>=2.9,<3",
]

[project.scripts]
ally = "ally.cli:main"
ally-desktop-bridge = "ally.desktop.bridge:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=5,<8",
  "pyright>=1.1.390,<2",
  "ruff>=0.8,<1",
]
security = [
  "pip-audit>=2.10.1,<3",
  "zizmor>=1.30.1,<2",
]

[dependency-groups]
build = ["hatchling>=1.27,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/ally"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
